<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc">
  <title id="title">Claudeに投げる前の3行テンプレ</title>
  <desc id="desc">AI副業向けの簡潔な指示テンプレをまとめた保存用カード</desc>
  <rect width="1080" height="1350" fill="#eef2f7"/>
  <rect x="72" y="72" width="936" height="1206" rx="36" fill="#ffffff"/>
  <rect x="72" y="72" width="936" height="24" rx="12" fill="#233a59"/>

  <text x="112" y="188" fill="#16212b" font-family="Noto Sans JP, Yu Gothic, sans-serif" font-size="58" font-weight="700">Claudeに投げる前の</text>
  <text x="112" y="262" fill="#16212b" font-family="Noto Sans JP, Yu Gothic, sans-serif" font-size="58" font-weight="700">3行テンプレ</text>

  <g font-family="Noto Sans JP, Yu Gothic, sans-serif" fill="#16212b">
    <rect x="112" y="350" width="856" height="190" rx="28" fill="#f4f8fc"/>
    <text x="152" y="420" font-size="36" font-weight="700">1. 誰向け</text>
    <text x="152" y="480" font-size="34" font-weight="500">AI副業を始めたい会社員向け</text>

    <rect x="112" y="584" width="856" height="190" rx="28" fill="#f4f8fc"/>
    <text x="152" y="654" font-size="36" font-weight="700">2. 何を作る</text>
    <text x="152" y="714" font-size="34" font-weight="500">Threads1本 / note見出し3つ</text>

    <rect x="112" y="818" width="856" height="230" rx="28" fill="#f4f8fc"/>
    <text x="152" y="888" font-size="36" font-weight="700">3. 入れない言葉</text>
    <text x="152" y="948" font-size="34" font-weight="500">みなさん / 曖昧表現 / 技術用語だらけ</text>
    <text x="152" y="1000" font-size="30" font-weight="500" fill="#4c5a67">長く書くより、最初にこの3行を置く</text>
  </g>

  <text x="112" y="1176" fill="#4c5a67" font-family="Noto Sans JP, Yu Gothic, sans-serif" font-size="28">Gaku@趣味でアプリつくるもの</text>
</svg>
