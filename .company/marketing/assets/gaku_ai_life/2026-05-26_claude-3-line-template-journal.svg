<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc">
  <title id="title">Claudeに投げる前の3行テンプレ 手帳ラフ</title>
  <desc id="desc">実験ログのような紙面で、Claude指示の3行テンプレをまとめた保存画像</desc>
  <defs>
    <pattern id="lines" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M0 22 H28" stroke="#ddd4c7" stroke-width="1"/>
    </pattern>
    <filter id="shadow2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#8b847a" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="1080" height="1350" fill="#f5f0e6"/>
  <rect width="1080" height="1350" fill="url(#lines)" opacity="0.6"/>

  <g transform="rotate(-2.6 548 668)" filter="url(#shadow2)">
    <rect x="102" y="104" width="876" height="1132" rx="28" fill="#fffaf2"/>
  </g>

  <g transform="rotate(-7 182 132)">
    <rect x="104" y="92" width="166" height="40" rx="8" fill="#d8c39f"/>
  </g>
  <g transform="rotate(5 872 132)">
    <rect x="804" y="92" width="168" height="40" rx="8" fill="#d8c39f"/>
  </g>

  <text x="146" y="176" fill="#8b847a" font-family="Georgia, 'Times New Roman', serif" font-size="24" letter-spacing="3">PROMPT NOTE / QUICK START</text>
  <text x="146" y="250" fill="#22201d" font-family="'Yu Gothic', 'Hiragino Sans', sans-serif" font-size="62" font-weight="700">Claudeに投げる前の</text>
  <text x="146" y="322" fill="#22201d" font-family="'Yu Gothic', 'Hiragino Sans', sans-serif" font-size="62" font-weight="700">3行テンプレ</text>

  <path d="M144 344 C278 360, 464 320, 640 342" fill="none" stroke="#30544d" stroke-width="8" stroke-linecap="round" opacity="0.85"/>
  <text x="690" y="354" fill="#30544d" font-family="'Yu Gothic', sans-serif" font-size="24" font-weight="700" transform="rotate(5 690 354)">長く書かない</text>

  <g fill="#22201d" font-family="'Yu Gothic', 'Hiragino Sans', sans-serif">
    <circle cx="182" cy="470" r="34" fill="none" stroke="#b85c4b" stroke-width="6"/>
    <text x="170" y="483" font-size="34" font-weight="700">1</text>
    <text x="242" y="454" font-size="40" font-weight="700">誰向け</text>
    <text x="242" y="506" font-size="30" fill="#6e665d">AI副業を始めたい会社員向け</text>

    <circle cx="182" cy="668" r="34" fill="none" stroke="#b85c4b" stroke-width="6"/>
    <text x="170" y="681" font-size="34" font-weight="700">2</text>
    <text x="242" y="652" font-size="40" font-weight="700">何を作る</text>
    <text x="242" y="704" font-size="30" fill="#6e665d">Threads1本 / note見出し3つ</text>

    <circle cx="182" cy="866" r="34" fill="none" stroke="#b85c4b" stroke-width="6"/>
    <text x="170" y="879" font-size="34" font-weight="700">3</text>
    <text x="242" y="850" font-size="40" font-weight="700">入れない言葉</text>
    <text x="242" y="902" font-size="30" fill="#6e665d">みなさん / 曖昧表現 / 技術用語だらけ</text>
  </g>

  <g transform="rotate(2.2 718 976)">
    <rect x="654" y="944" width="238" height="144" rx="14" fill="#f4e1a8"/>
    <text x="686" y="994" fill="#30544d" font-family="'Yu Gothic', sans-serif" font-size="24" font-weight="700">CHECK</text>
    <text x="686" y="1034" fill="#22201d" font-family="'Yu Gothic', sans-serif" font-size="24">誰向けか</text>
    <text x="686" y="1068" fill="#22201d" font-family="'Yu Gothic', sans-serif" font-size="24">1行目で言えてる?</text>
  </g>

  <path d="M240 922 C414 950, 556 924, 774 934" fill="none" stroke="#b85c4b" stroke-width="6" stroke-linecap="round" opacity="0.8"/>

  <text x="146" y="1194" fill="#8b847a" font-family="Georgia, 'Times New Roman', serif" font-size="24" letter-spacing="3">GAKU AI LIFE / DRAFT BEFORE POST</text>
  <text x="146" y="1232" fill="#5b554e" font-family="'Yu Gothic', sans-serif" font-size="28">Gaku@趣味でアプリつくるもの</text>
</svg>
