<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc">
  <title id="title">note導線 最初に直す5か所 手帳ラフ</title>
  <desc id="desc">より手書きの印や余白を増やした、手帳っぽい実験ログ風の保存画像</desc>
  <defs>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="7" cy="7" r="1.2" fill="#d8d0c4"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#8b847a" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="1080" height="1350" fill="#f5f0e6"/>
  <rect width="1080" height="1350" fill="url(#dots)" opacity="0.45"/>

  <g transform="rotate(-5 188 120)">
    <rect x="118" y="84" width="144" height="40" rx="8" fill="#d8c39f" opacity="0.92"/>
  </g>
  <g transform="rotate(7 884 126)">
    <rect x="818" y="88" width="166" height="42" rx="8" fill="#d8c39f" opacity="0.88"/>
  </g>

  <g transform="rotate(-1.2 536 676)" filter="url(#shadow)">
    <rect x="98" y="100" width="884" height="1148" rx="24" fill="#fffaf2"/>
    <path d="M178 130 V1208" stroke="#d9a29a" stroke-width="3.5" opacity="0.8"/>
    <circle cx="134" cy="228" r="11" fill="#e9dfcf"/>
    <circle cx="134" cy="430" r="11" fill="#e9dfcf"/>
    <circle cx="134" cy="632" r="11" fill="#e9dfcf"/>
    <circle cx="134" cy="834" r="11" fill="#e9dfcf"/>
    <circle cx="134" cy="1036" r="11" fill="#e9dfcf"/>
  </g>

  <text x="214" y="176" fill="#8b847a" font-family="Georgia, 'Times New Roman', serif" font-size="23" letter-spacing="3">FIELD NOTE / SAVE POST</text>
  <text x="212" y="252" fill="#22201d" font-family="'Yu Gothic', 'Hiragino Sans', sans-serif" font-size="66" font-weight="700">note導線</text>
  <text x="212" y="326" fill="#22201d" font-family="'Yu Gothic', 'Hiragino Sans', sans-serif" font-size="66" font-weight="700">最初に直す5か所</text>

  <path d="M210 344 C324 330, 474 356, 636 340" fill="none" stroke="#b85c4b" stroke-width="7.5" stroke-linecap="round" opacity="0.86"/>
  <text x="708" y="338" fill="#b85c4b" font-family="'Segoe Print', 'Comic Sans MS', cursive" font-size="26" transform="rotate(-5 708 338)">売る前にここ</text>
  <path d="M800 346 C776 356, 746 378, 724 412" fill="none" stroke="#b85c4b" stroke-width="5" stroke-linecap="round"/>

  <g font-family="'Yu Gothic', 'Hiragino Sans', sans-serif">
    <circle cx="224" cy="434" r="30" fill="none" stroke="#b85c4b" stroke-width="6"/>
    <text x="212" y="446" fill="#22201d" font-size="34" font-weight="700">1</text>
    <text x="278" y="436" fill="#22201d" font-size="40" font-weight="700">プロフで誰向けか言う</text>
    <text x="278" y="486" fill="#6e665d" font-size="28">誰の記録か見えないと、入口で止まります。</text>
    <path d="M278 452 C360 462, 438 428, 514 446" fill="none" stroke="#30544d" stroke-width="5" stroke-linecap="round" opacity="0.75"/>

    <circle cx="236" cy="592" r="30" fill="none" stroke="#b85c4b" stroke-width="6"/>
    <text x="224" y="604" fill="#22201d" font-size="34" font-weight="700">2</text>
    <text x="290" y="594" fill="#22201d" font-size="40" font-weight="700">固定投稿で無料記事へつなぐ</text>
    <text x="290" y="644" fill="#6e665d" font-size="28">いきなり売るより、先に無料で信頼を作る。</text>
    <path d="M288 654 C420 648, 544 662, 652 650" fill="none" stroke="#b85c4b" stroke-width="4.5" stroke-linecap="round" opacity="0.72"/>

    <circle cx="220" cy="756" r="30" fill="none" stroke="#b85c4b" stroke-width="6"/>
    <text x="208" y="768" fill="#22201d" font-size="34" font-weight="700">3</text>
    <text x="274" y="750" fill="#22201d" font-size="40" font-weight="700">Threadsは悩み1つだけにする</text>
    <text x="274" y="800" fill="#6e665d" font-size="28">全部言うより、1つ残した方が続きを読みたくなる。</text>
    <text x="756" y="804" fill="#8b847a" font-family="'Segoe Print', 'Comic Sans MS', cursive" font-size="24" transform="rotate(-4 756 804)">詰めこまない</text>

    <circle cx="236" cy="926" r="30" fill="none" stroke="#b85c4b" stroke-width="6"/>
    <text x="224" y="938" fill="#22201d" font-size="34" font-weight="700">4</text>
    <text x="290" y="928" fill="#22201d" font-size="40" font-weight="700">noteで解決まで渡す</text>
    <text x="290" y="978" fill="#6e665d" font-size="28">Threadsは入口。noteで納得まで持っていく。</text>
    <path d="M288 986 C378 1010, 480 972, 604 992" fill="none" stroke="#30544d" stroke-width="4.5" stroke-linecap="round" opacity="0.7"/>

    <circle cx="222" cy="1096" r="30" fill="none" stroke="#b85c4b" stroke-width="6"/>
    <text x="210" y="1108" fill="#22201d" font-size="34" font-weight="700">5</text>
    <text x="276" y="1098" fill="#22201d" font-size="40" font-weight="700">有料は最後に置く</text>
    <text x="276" y="1148" fill="#6e665d" font-size="28">最初に値段を見せると、途中で止まりやすい。</text>
  </g>

  <g transform="rotate(2.4 786 930)">
    <rect x="694" y="880" width="226" height="156" rx="12" fill="#f4e1a8" opacity="0.96"/>
    <text x="724" y="924" fill="#30544d" font-family="'Segoe Print', 'Comic Sans MS', cursive" font-size="24">memo</text>
    <text x="724" y="964" fill="#22201d" font-family="'Yu Gothic', sans-serif" font-size="24">読まれる流れを</text>
    <text x="724" y="998" fill="#22201d" font-family="'Yu Gothic', sans-serif" font-size="24">先に作ってから</text>
    <text x="724" y="1032" fill="#22201d" font-family="'Yu Gothic', sans-serif" font-size="24">最後に売る。</text>
  </g>

  <path d="M686 1032 C644 1060, 604 1082, 560 1092" fill="none" stroke="#b85c4b" stroke-width="5" stroke-linecap="round"/>
  <text x="600" y="1068" fill="#b85c4b" font-family="'Segoe Print', 'Comic Sans MS', cursive" font-size="23" transform="rotate(-8 600 1068)">ここ大事</text>

  <text x="214" y="1204" fill="#8b847a" font-family="Georgia, 'Times New Roman', serif" font-size="23" letter-spacing="3">GAKU AI LIFE / WORKING NOTE</text>
  <text x="214" y="1240" fill="#5b554e" font-family="'Yu Gothic', sans-serif" font-size="28">Gaku@趣味でアプリつくるもの</text>
</svg>
