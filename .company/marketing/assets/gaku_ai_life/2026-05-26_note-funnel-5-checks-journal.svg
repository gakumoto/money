<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc">
  <title id="title">note導線 最初に直す5か所 手帳ラフ</title>
  <desc id="desc">紙のメモと赤鉛筆の印で構成した、手帳っぽい実験ログ風の保存画像</desc>
  <defs>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="8" r="1.3" fill="#d8d0c4"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#8b847a" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="1080" height="1350" fill="#f5f0e6"/>
  <rect width="1080" height="1350" fill="url(#dots)" opacity="0.45"/>

  <g transform="rotate(-4 184 126)">
    <rect x="108" y="84" width="156" height="42" rx="8" fill="#d8c39f" opacity="0.9"/>
  </g>
  <g transform="rotate(6 868 134)">
    <rect x="806" y="92" width="170" height="44" rx="8" fill="#d8c39f" opacity="0.9"/>
  </g>

  <g transform="rotate(-1.4 540 675)" filter="url(#shadow)">
    <rect x="94" y="100" width="892" height="1148" rx="26" fill="#fffaf2"/>
  </g>

  <text x="138" y="176" fill="#8b847a" font-family="Georgia, 'Times New Roman', serif" font-size="24" letter-spacing="3">FIELD NOTE / SAVE POST</text>
  <text x="138" y="250" fill="#22201d" font-family="'Yu Gothic', 'Hiragino Sans', sans-serif" font-size="68" font-weight="700">note導線</text>
  <text x="138" y="326" fill="#22201d" font-family="'Yu Gothic', 'Hiragino Sans', sans-serif" font-size="68" font-weight="700">最初に直す5か所</text>

  <path d="M138 346 C290 332, 470 356, 660 340" fill="none" stroke="#b85c4b" stroke-width="8" stroke-linecap="round" opacity="0.82"/>
  <text x="746" y="344" fill="#b85c4b" font-family="'Yu Gothic', sans-serif" font-size="24" font-weight="700" transform="rotate(-6 746 344)">最初はここ</text>

  <g fill="#22201d" font-family="'Yu Gothic', 'Hiragino Sans', sans-serif">
    <text x="152" y="450" font-size="44" font-weight="700">1.</text>
    <text x="214" y="450" font-size="40" font-weight="700">プロフで誰向けか言う</text>
    <text x="214" y="500" font-size="28" fill="#6e665d">誰に向けた記録かが最初に見えないと弱い</text>

    <text x="152" y="610" font-size="44" font-weight="700">2.</text>
    <text x="214" y="610" font-size="40" font-weight="700">固定投稿で無料記事へつなぐ</text>
    <text x="214" y="660" font-size="28" fill="#6e665d">いきなり売るより、先に無料で信頼を作る</text>

    <text x="152" y="770" font-size="44" font-weight="700">3.</text>
    <text x="214" y="770" font-size="40" font-weight="700">Threadsは悩み1つだけにする</text>
    <text x="214" y="820" font-size="28" fill="#6e665d">1投稿で全部言うより、1つだけ残す</text>

    <text x="152" y="930" font-size="44" font-weight="700">4.</text>
    <text x="214" y="930" font-size="40" font-weight="700">noteで解決まで渡す</text>
    <text x="214" y="980" font-size="28" fill="#6e665d">Threadsは入口。noteで納得まで持っていく</text>

    <text x="152" y="1090" font-size="44" font-weight="700">5.</text>
    <text x="214" y="1090" font-size="40" font-weight="700">有料は最後に置く</text>
    <text x="214" y="1140" font-size="28" fill="#6e665d">最初に値段を見せると、途中で止まりやすい</text>
  </g>

  <g transform="rotate(1.7 796 892)">
    <rect x="706" y="866" width="220" height="118" rx="12" fill="#f4e1a8" opacity="0.95"/>
    <text x="734" y="912" fill="#30544d" font-family="'Yu Gothic', sans-serif" font-size="26" font-weight="700">MEMO</text>
    <text x="734" y="952" fill="#22201d" font-family="'Yu Gothic', sans-serif" font-size="24">売る前に、</text>
    <text x="734" y="986" fill="#22201d" font-family="'Yu Gothic', sans-serif" font-size="24">読まれる流れ。</text>
  </g>

  <circle cx="202" cy="1080" r="48" fill="none" stroke="#b85c4b" stroke-width="8"/>
  <path d="M198 1080 l-14 14" stroke="#b85c4b" stroke-width="7" stroke-linecap="round"/>
  <path d="M201 1080 l16 -22" stroke="#b85c4b" stroke-width="7" stroke-linecap="round"/>

  <text x="138" y="1202" fill="#8b847a" font-family="Georgia, 'Times New Roman', serif" font-size="24" letter-spacing="3">GAKU AI LIFE / WORKING NOTE</text>
  <text x="138" y="1240" fill="#5b554e" font-family="'Yu Gothic', sans-serif" font-size="28">Gaku@趣味でアプリつくるもの</text>
</svg>
